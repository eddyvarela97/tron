<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tron: Training Ares</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Courier New', monospace;
            color: #0ff;
            overflow: hidden;
        }

        .container {
            text-align: center;
            position: relative;
        }

        /* Main title styling */
        h1 {
            font-size: 72px;
            margin: 0 0 20px 0;
            color: #0ff;
            text-shadow: 0 0 20px #0ff,
                         0 0 40px #0ff,
                         0 0 60px #0ff;
            letter-spacing: 10px;
            animation: pulse 2s ease-in-out infinite;
        }

        /* Subtitle styling */
        .subtitle {
            font-size: 32px;
            color: #f0f;
            text-shadow: 0 0 15px #f0f,
                         0 0 30px #f0f;
            letter-spacing: 5px;
            margin-bottom: 40px;
            animation: glow 3s ease-in-out infinite alternate;
        }

        /* Pulsing animation for title */
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        /* Glowing animation for subtitle */
        @keyframes glow {
            0% {
                text-shadow: 0 0 15px #f0f,
                             0 0 30px #f0f;
            }
            100% {
                text-shadow: 0 0 25px #f0f,
                             0 0 50px #f0f,
                             0 0 75px #f0f;
            }
        }

        /* Decorative frame */
        .frame {
            position: absolute;
            top: -50px;
            left: -50px;
            right: -50px;
            bottom: -50px;
            border: 2px solid #0ff;
            box-shadow: 0 0 20px #0ff,
                        inset 0 0 20px rgba(0, 255, 255, 0.1);
            pointer-events: none;
        }

        /* Corner decorations */
        .corner {
            position: absolute;
            width: 40px;
            height: 40px;
            border: 2px solid #0ff;
        }

        .corner.top-left {
            top: -52px;
            left: -52px;
            border-right: none;
            border-bottom: none;
            box-shadow: -5px -5px 10px #0ff;
        }

        .corner.top-right {
            top: -52px;
            right: -52px;
            border-left: none;
            border-bottom: none;
            box-shadow: 5px -5px 10px #0ff;
        }

        .corner.bottom-left {
            bottom: -52px;
            left: -52px;
            border-right: none;
            border-top: none;
            box-shadow: -5px 5px 10px #0ff;
        }

        .corner.bottom-right {
            bottom: -52px;
            right: -52px;
            border-left: none;
            border-top: none;
            box-shadow: 5px 5px 10px #0ff;
        }

        /* Status indicator */
        .status {
            position: absolute;
            bottom: -100px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 14px;
            color: #666;
            letter-spacing: 2px;
            animation: blink 2s ease-in-out infinite;
        }

        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0.3; }
        }

        /* Grid overlay effect */
        .grid-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image:
                linear-gradient(rgba(0, 255, 255, 0.1) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 255, 0.1) 1px, transparent 1px);
            background-size: 50px 50px;
            pointer-events: none;
            opacity: 0.3;
            z-index: -1;
        }
    </style>
</head>
<body>
    <div class="grid-overlay"></div>

    <div class="container">
        <div class="frame">
            <div class="corner top-left"></div>
            <div class="corner top-right"></div>
            <div class="corner bottom-left"></div>
            <div class="corner bottom-right"></div>
        </div>

        <h1>TRON</h1>
        <div class="subtitle">TRAINING ARES</div>

        <div class="status">SYSTEM READY</div>
    </div>
</body>
</html>
